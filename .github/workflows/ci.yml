name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis_ci
          POSTGRES_DB: aegis_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://aegis:aegis_ci@localhost:5432/aegis_ci?schema=public
      DIRECT_URL: postgresql://aegis:aegis_ci@localhost:5432/aegis_ci?schema=public
      TEST_DATABASE_URL: postgresql://aegis:aegis_ci@localhost:5432/aegis_ci?schema=public
      TEST_REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: "1"
      # Optional: add an NVD_API_KEY repo secret to enable the live CVE intel test.
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      # Optional: add an OPENAI_API_KEY repo secret to enable the live AI test.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci # postinstall runs `prisma generate`

      - name: Apply migrations
        run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      - name: Build web (also generates Next type stubs)
        run: npx next build
        working-directory: apps/web

      - name: Typecheck
        run: npm run typecheck

      # The Scope Authorization Gate suite is safety-critical: it runs first and
      # on its own, so a gate regression is the first thing a red build shows.
      - name: Scope gate tests
        run: npx vitest run test/scopeGate.test.ts test/targets.test.ts
        working-directory: packages/core

      # Everything: unit tests + Postgres/Redis integration tests.
      - name: Test
        run: npm test

      # Live CVE intel against NVD/EPSS/KEV, only when the NVD key secret is set.
      - name: CVE intel (live)
        if: env.NVD_API_KEY != ''
        env:
          CVE_LIVE: "1"
        run: npx vitest run test/live.integration.test.ts
        working-directory: packages/cve

      # Live AI advisory, only when the OpenAI key secret is set.
      - name: AI advisory (live)
        if: env.OPENAI_API_KEY != ''
        env:
          AI_LIVE: "1"
          AI_PROVIDER: openai
        run: npx vitest run test/live.integration.test.ts
        working-directory: packages/ai

  # Each worker image must build, run as non-root, and contain working,
  # flag-compatible tools (the Dockerfiles assert the flags we depend on).
  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        worker: [discovery, tls, web, network]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.worker }} worker image
        run: docker build -f workers/${{ matrix.worker }}/Dockerfile -t aegis/worker-${{ matrix.worker }}:ci .
      - name: Image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id aegis/worker-${{ matrix.worker }}:ci -u)" != "0"

  # The API and dashboard images must build and run as non-root.
  app-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t aegis/api:ci .
      - name: API image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id aegis/api:ci -u)" != "0"
      - name: Build web image
        run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=https://api.example.com -t aegis/web:ci .
      - name: Web image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id aegis/web:ci -u)" != "0"

