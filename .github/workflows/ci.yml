name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis_ci
          POSTGRES_DB: aegis_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://aegis:aegis_ci@localhost:5432/aegis_ci?schema=public
      DIRECT_URL: postgresql://aegis:aegis_ci@localhost:5432/aegis_ci?schema=public
      TEST_DATABASE_URL: postgresql://aegis:aegis_ci@localhost:5432/aegis_ci?schema=public
      TEST_REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci # postinstall runs `prisma generate`

      - name: Apply migrations
        run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      - name: Build web (also generates Next type stubs)
        run: npx next build
        working-directory: apps/web

      - name: Typecheck
        run: npm run typecheck

      # The Scope Authorization Gate suite is safety-critical: it runs first and
      # on its own, so a gate regression is the first thing a red build shows.
      - name: Scope gate tests
        run: npx vitest run test/scopeGate.test.ts test/targets.test.ts
        working-directory: packages/core

      # Everything: unit tests + Postgres/Redis integration tests.
      - name: Test
        run: npm test
