# Scan workers for the VPS (docs/DEPLOY_VPS.md). Each worker is a sandboxed,
# resource-limited container on its own network, whose egress the host
# firewall restricts (see the doc).
#
#   docker compose -f docker-compose.workers.yml --env-file workers.env up -d --build
name: aegis-workers

x-sandbox: &sandbox
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  restart: unless-stopped
  networks: [workers]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  discovery:
    <<: *sandbox
    build:
      context: .
      dockerfile: workers/discovery/Dockerfile
    image: aegis/worker-discovery:latest
    # Only what the worker needs. No API keys, no JWT secrets.
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in workers.env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in workers.env}
      DISCOVERY_CONCURRENCY: ${DISCOVERY_CONCURRENCY:-1}
    mem_limit: 1g
    cpus: 1.0

  tls:
    <<: *sandbox
    build:
      context: .
      dockerfile: workers/tls/Dockerfile
    image: aegis/worker-tls:latest
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in workers.env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in workers.env}
      TLS_CONCURRENCY: ${TLS_CONCURRENCY:-1}
    mem_limit: 1g
    cpus: 1.0

  web:
    <<: *sandbox
    build:
      context: .
      dockerfile: workers/web/Dockerfile
    image: aegis/worker-web:latest
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in workers.env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in workers.env}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    mem_limit: 768m
    cpus: 1.0

  # NETWORK runs Admin-approved port scans. Keep its scale low and its egress
  # filter strict (see docs/DEPLOY_VPS.md).
  network:
    <<: *sandbox
    build:
      context: .
      dockerfile: workers/network/Dockerfile
    image: aegis/worker-network:latest
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in workers.env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in workers.env}
      NETWORK_CONCURRENCY: ${NETWORK_CONCURRENCY:-1}
    mem_limit: 1g
    cpus: 1.0

  # CLOUD runs Admin-approved, read-only prowler assessments of a customer AWS
  # account. It needs the Aegis *platform* AWS credentials (to call
  # sts:AssumeRole on the customer's role) and outbound HTTPS to AWS — but still
  # no JWT/AI/SMTP secrets. prowler writes its OCSF output under /tmp, so this
  # one gets a larger tmpfs than the default sandbox.
  cloud:
    <<: *sandbox
    build:
      context: .
      dockerfile: workers/cloud/Dockerfile
    image: aegis/worker-cloud:latest
    tmpfs:
      - /tmp:size=512m,mode=1777
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in workers.env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in workers.env}
      CLOUD_CONCURRENCY: ${CLOUD_CONCURRENCY:-1}
      # Aegis platform IAM credentials, allowed only to assume customer roles.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    mem_limit: 2g
    cpus: 1.0

networks:
  workers:
    driver: bridge
    driver_opts:
      # Fixed bridge name so the host firewall rules can target it.
      com.docker.network.bridge.name: aegis-workers
